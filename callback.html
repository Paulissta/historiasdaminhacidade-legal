<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Autorização concluída</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222;background:#fff}h1{font-size:1.6rem}code,textarea{font-family:ui-monospace,monospace}</style></head><body>
<h1>Autorização do TikTok</h1>
<p id="msg">Copie a URL abaixo e cole no terminal (comando <code>tiktok-login</code>).</p>
<textarea id="u" rows="5" style="width:100%" readonly></textarea>
<p><button id="b">Copiar</button></p>
<script>
var t=document.getElementById('u');t.value=location.href;
var q=new URLSearchParams(location.search);
if(q.get('error')){document.getElementById('msg').textContent='Erro: '+q.get('error')+' - '+(q.get('error_description')||'');}
document.getElementById('b').onclick=function(){t.select();navigator.clipboard.writeText(t.value).then(function(){document.getElementById('b').textContent='Copiado!'});};
</script>
</body></html>
